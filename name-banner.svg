<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#071b2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="180" fill="url(#bg)"/>

  <!-- Radar / sonar rings centered on name -->
  <g filter="url(#softglow)">
    <circle cx="600" cy="90" r="38"  fill="none" stroke="#22d3ee" stroke-width="0.9" opacity="0.65"/>
    <circle cx="600" cy="90" r="75"  fill="none" stroke="#22d3ee" stroke-width="0.7" opacity="0.50"/>
    <circle cx="600" cy="90" r="122" fill="none" stroke="#22d3ee" stroke-width="0.55" opacity="0.38"/>
    <circle cx="600" cy="90" r="178" fill="none" stroke="#22d3ee" stroke-width="0.45" opacity="0.26"/>
    <circle cx="600" cy="90" r="245" fill="none" stroke="#22d3ee" stroke-width="0.4"  opacity="0.18"/>
    <circle cx="600" cy="90" r="324" fill="none" stroke="#22d3ee" stroke-width="0.35" opacity="0.12"/>
    <circle cx="600" cy="90" r="415" fill="none" stroke="#22d3ee" stroke-width="0.3"  opacity="0.08"/>
    <circle cx="600" cy="90" r="520" fill="none" stroke="#22d3ee" stroke-width="0.25" opacity="0.05"/>
  </g>

  <!-- Crosshair lines -->
  <line x1="600" y1="0"    x2="600"  y2="180" stroke="#22d3ee" stroke-width="0.4" opacity="0.12"/>
  <line x1="0"   y1="90"   x2="1200" y2="90"  stroke="#22d3ee" stroke-width="0.4" opacity="0.12"/>

  <!-- HUD corner brackets — top-left -->
  <polyline points="16,16 16,50 50,50" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- HUD corner brackets — top-right -->
  <polyline points="1184,16 1184,50 1150,50" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- HUD corner brackets — bottom-left -->
  <polyline points="16,164 16,130 50,130" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- HUD corner brackets — bottom-right -->
  <polyline points="1184,164 1184,130 1150,130" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Center pip -->
  <circle cx="600" cy="90" r="3.5" fill="#22d3ee" opacity="0.9"/>
  <circle cx="600" cy="90" r="7"   fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>

  <!-- Tick marks on inner ring -->
  <line x1="600" y1="48"  x2="600" y2="56"  stroke="#22d3ee" stroke-width="1.2" opacity="0.55"/>
  <line x1="600" y1="124" x2="600" y2="132" stroke="#22d3ee" stroke-width="1.2" opacity="0.55"/>
  <line x1="558" y1="86"  x2="566" y2="86"  stroke="#22d3ee" stroke-width="1.2" opacity="0.55"/>
  <line x1="634" y1="86"  x2="642" y2="86"  stroke="#22d3ee" stroke-width="1.2" opacity="0.55"/>

  <!-- Floating accent dots -->
  <circle cx="100" cy="36"  r="2"   fill="#22d3ee" opacity="0.40"/>
  <circle cx="130" cy="55"  r="1.5" fill="#22d3ee" opacity="0.30"/>
  <circle cx="78"  cy="62"  r="1"   fill="#22d3ee" opacity="0.25"/>
  <circle cx="1100" cy="36" r="2"   fill="#22d3ee" opacity="0.40"/>
  <circle cx="1070" cy="55" r="1.5" fill="#22d3ee" opacity="0.30"/>
  <circle cx="1122" cy="62" r="1"   fill="#22d3ee" opacity="0.25"/>
  <circle cx="60"  cy="130" r="1.5" fill="#22d3ee" opacity="0.25"/>
  <circle cx="1140" cy="130" r="1.5" fill="#22d3ee" opacity="0.25"/>

  <!-- Side range markers -->
  <circle cx="162" cy="90" r="1.8" fill="#22d3ee" opacity="0.30"/>
  <circle cx="1038" cy="90" r="1.8" fill="#22d3ee" opacity="0.30"/>

  <!-- Name — cyan glow pass -->
  <text x="600" y="112" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="76" font-weight="800" letter-spacing="12"
    fill="#22d3ee" opacity="0.18" filter="url(#glow)">AMADEO BONDE</text>

  <!-- Name — main white text -->
  <text x="600" y="112" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="76" font-weight="800" letter-spacing="12"
    fill="#f0f6fc">AMADEO BONDE</text>
</svg>
