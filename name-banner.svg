<svg xmlns="http://www.w3.org/2000/svg" width="860" height="100" viewBox="0 0 860 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color"
          values="#58a6ff;#a371f7;#f778ba;#58a6ff"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a371f7">
        <animate attributeName="stop-color"
          values="#a371f7;#f778ba;#58a6ff;#a371f7"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f778ba">
        <animate attributeName="stop-color"
          values="#f778ba;#58a6ff;#a371f7;#f778ba"
          dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="860" height="100" fill="#0d1117"/>
  <text
    x="430" y="70"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="62"
    font-weight="700"
    letter-spacing="-1.5"
    fill="url(#g)"
    filter="url(#glow)">amadeo bonde</text>
</svg>
