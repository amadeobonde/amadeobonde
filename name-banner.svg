<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">

  <!-- Background -->
  <rect width="1200" height="180" fill="#0d1117"/>

  <!-- Radar rings — no filters, just strokes with opacity -->
  <circle cx="600" cy="90" r="38"  fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.55"/>
  <circle cx="600" cy="90" r="76"  fill="none" stroke="#22d3ee" stroke-width="0.9" opacity="0.42"/>
  <circle cx="600" cy="90" r="124" fill="none" stroke="#22d3ee" stroke-width="0.7" opacity="0.30"/>
  <circle cx="600" cy="90" r="182" fill="none" stroke="#22d3ee" stroke-width="0.6" opacity="0.20"/>
  <circle cx="600" cy="90" r="252" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.14"/>
  <circle cx="600" cy="90" r="334" fill="none" stroke="#22d3ee" stroke-width="0.4" opacity="0.09"/>
  <circle cx="600" cy="90" r="428" fill="none" stroke="#22d3ee" stroke-width="0.35" opacity="0.06"/>
  <circle cx="600" cy="90" r="536" fill="none" stroke="#22d3ee" stroke-width="0.3"  opacity="0.04"/>

  <!-- Crosshairs -->
  <line x1="600" y1="0"    x2="600"  y2="180" stroke="#22d3ee" stroke-width="0.4" opacity="0.10"/>
  <line x1="0"   y1="90"   x2="1200" y2="90"  stroke="#22d3ee" stroke-width="0.4" opacity="0.10"/>

  <!-- HUD corner brackets -->
  <polyline points="14,14 14,48 48,48"       fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.80"/>
  <polyline points="1186,14 1186,48 1152,48"  fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.80"/>
  <polyline points="14,166 14,132 48,132"     fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.80"/>
  <polyline points="1186,166 1186,132 1152,132" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.80"/>

  <!-- Center pip -->
  <circle cx="600" cy="90" r="3"   fill="#22d3ee" opacity="0.85"/>
  <circle cx="600" cy="90" r="6.5" fill="none" stroke="#22d3ee" stroke-width="0.9" opacity="0.55"/>

  <!-- Tick marks on inner ring -->
  <line x1="600" y1="48"  x2="600" y2="57"  stroke="#22d3ee" stroke-width="1.2" opacity="0.50"/>
  <line x1="600" y1="123" x2="600" y2="132" stroke="#22d3ee" stroke-width="1.2" opacity="0.50"/>
  <line x1="557" y1="86"  x2="566" y2="86"  stroke="#22d3ee" stroke-width="1.2" opacity="0.50"/>
  <line x1="634" y1="86"  x2="643" y2="86"  stroke="#22d3ee" stroke-width="1.2" opacity="0.50"/>

  <!-- Accent dots -->
  <circle cx="96"  cy="34"  r="2"   fill="#22d3ee" opacity="0.38"/>
  <circle cx="118" cy="52"  r="1.4" fill="#22d3ee" opacity="0.28"/>
  <circle cx="74"  cy="58"  r="1"   fill="#22d3ee" opacity="0.22"/>
  <circle cx="1104" cy="34" r="2"   fill="#22d3ee" opacity="0.38"/>
  <circle cx="1082" cy="52" r="1.4" fill="#22d3ee" opacity="0.28"/>
  <circle cx="1126" cy="58" r="1"   fill="#22d3ee" opacity="0.22"/>
  <circle cx="60"  cy="130" r="1.4" fill="#22d3ee" opacity="0.22"/>
  <circle cx="1140" cy="130" r="1.4" fill="#22d3ee" opacity="0.22"/>

  <!-- Faux glow: two low-opacity copies behind the text -->
  <text x="600" y="114" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="76" font-weight="800" letter-spacing="12"
    fill="#22d3ee" opacity="0.10">AMADEO BONDE</text>
  <text x="601" y="115" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="76" font-weight="800" letter-spacing="12"
    fill="#22d3ee" opacity="0.07">AMADEO BONDE</text>

  <!-- Main name -->
  <text x="600" y="114" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="76" font-weight="800" letter-spacing="12"
    fill="#f0f6fc">AMADEO BONDE</text>

</svg>
