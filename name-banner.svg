<svg xmlns="http://www.w3.org/2000/svg" width="860" height="130" viewBox="0 0 860 130">
  <defs>
    <filter id="glow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="860" height="130" fill="#0d1117"/>

  <!-- glow layer -->
  <text
    x="430" y="90"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="6"
    fill="#58a6ff"
    opacity="0.35"
    filter="url(#glow)">AMADEO BONDE</text>

  <!-- crisp white text on top -->
  <text
    x="430" y="90"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="6"
    fill="#f0f6fc">AMADEO BONDE</text>
</svg>
