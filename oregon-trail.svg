<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140">
<defs>
  <g id="tuft-lg">
    <rect x="-6" y="-12" width="4" height="12" fill="#2D7A00"/>
    <rect x="-2" y="-16" width="4" height="16" fill="#2D7A00"/>
    <rect x="2"  y="-12" width="4" height="12" fill="#2D7A00"/>
  </g>
  <g id="tuft-sm">
    <rect x="-4" y="-8" width="3" height="8" fill="#2D7A00"/>
    <rect x="-1" y="-11" width="3" height="11" fill="#2D7A00"/>
    <rect x="2"  y="-8" width="3" height="8" fill="#2D7A00"/>
  </g>
  <style>
    .clouds  { animation: drift 22s linear infinite; }
    .clouds2 { animation: drift 30s linear infinite -11s; }
    .gscroll { animation: gscroll 1.6s linear infinite; }
    @keyframes drift   { from { transform: translateX(80px);  } to { transform: translateX(-880px); } }
    @keyframes gscroll { from { transform: translateX(0);     } to { transform: translateX(-80px);  } }
  </style>
</defs>

<!-- ── SKY ── -->
<rect width="800" height="140" fill="#5C94FC"/>

<!-- ── SUN ── -->
<!-- rays -->
<rect x="50" y="6"  width="12" height="8"  fill="#FCFC00"/>
<rect x="50" y="50" width="12" height="8"  fill="#FCFC00"/>
<rect x="28" y="26" width="8"  height="12" fill="#FCFC00"/>
<rect x="76" y="26" width="8"  height="12" fill="#FCFC00"/>
<rect x="32" y="12" width="8"  height="8"  fill="#FCFC00"/>
<rect x="72" y="12" width="8"  height="8"  fill="#FCFC00"/>
<rect x="32" y="44" width="8"  height="8"  fill="#FCFC00"/>
<rect x="72" y="44" width="8"  height="8"  fill="#FCFC00"/>
<!-- body -->
<rect x="38" y="14" width="36" height="36" fill="#FCFC00"/>

<!-- ── CLOUDS layer 1 ── -->
<g class="clouds">
  <rect x="160" y="16" width="64" height="8" fill="white"/>
  <rect x="168" y="8"  width="48" height="8" fill="white"/>
  <rect x="176" y="2"  width="32" height="8" fill="white"/>

  <rect x="440" y="22" width="56" height="8" fill="white"/>
  <rect x="448" y="14" width="40" height="8" fill="white"/>
  <rect x="456" y="8"  width="24" height="8" fill="white"/>

  <rect x="680" y="14" width="72" height="8" fill="white"/>
  <rect x="688" y="6"  width="56" height="8" fill="white"/>
  <rect x="696" y="0"  width="40" height="8" fill="white"/>
</g>

<!-- ── CLOUDS layer 2 ── -->
<g class="clouds2">
  <rect x="60"  y="28" width="44" height="8" fill="white" opacity="0.82"/>
  <rect x="68"  y="20" width="28" height="8" fill="white" opacity="0.82"/>

  <rect x="340" y="18" width="52" height="8" fill="white" opacity="0.82"/>
  <rect x="348" y="10" width="36" height="8" fill="white" opacity="0.82"/>

  <rect x="580" y="24" width="40" height="8" fill="white" opacity="0.82"/>
  <rect x="588" y="16" width="24" height="8" fill="white" opacity="0.82"/>
</g>

<!-- ── GROUND ── -->
<rect y="110" width="800" height="30" fill="#8B6914"/>
<rect y="110" width="800" height="3"  fill="#9E7520"/>

<!-- ── SCROLLING GRASS ── -->
<g class="gscroll">
  <use href="#tuft-lg" transform="translate(20,110)"/>
  <use href="#tuft-sm" transform="translate(50,110)"/>
  <use href="#tuft-lg" transform="translate(100,110)"/>
  <use href="#tuft-sm" transform="translate(130,110)"/>
  <use href="#tuft-lg" transform="translate(180,110)"/>
  <use href="#tuft-sm" transform="translate(210,110)"/>
  <use href="#tuft-lg" transform="translate(260,110)"/>
  <use href="#tuft-sm" transform="translate(290,110)"/>
  <use href="#tuft-lg" transform="translate(340,110)"/>
  <use href="#tuft-sm" transform="translate(370,110)"/>
  <use href="#tuft-lg" transform="translate(420,110)"/>
  <use href="#tuft-sm" transform="translate(450,110)"/>
  <use href="#tuft-lg" transform="translate(500,110)"/>
  <use href="#tuft-sm" transform="translate(530,110)"/>
  <use href="#tuft-lg" transform="translate(580,110)"/>
  <use href="#tuft-sm" transform="translate(610,110)"/>
  <use href="#tuft-lg" transform="translate(660,110)"/>
  <use href="#tuft-sm" transform="translate(690,110)"/>
  <use href="#tuft-lg" transform="translate(740,110)"/>
  <use href="#tuft-sm" transform="translate(770,110)"/>
  <use href="#tuft-lg" transform="translate(820,110)"/>
  <use href="#tuft-sm" transform="translate(850,110)"/>
</g>

<!-- ── CACTUS (right) ── -->
<!-- trunk -->
<rect x="686" y="72" width="8" height="38" fill="#1E7A00"/>
<!-- left arm -->
<rect x="674" y="80" width="12" height="6" fill="#1E7A00"/>
<rect x="674" y="72" width="6" height="14" fill="#1E7A00"/>
<!-- right arm -->
<rect x="694" y="88" width="12" height="6" fill="#1E7A00"/>
<rect x="700" y="80" width="6" height="14" fill="#1E7A00"/>
<!-- spines -->
<rect x="684" y="68" width="2" height="6" fill="#1E7A00"/>
<rect x="690" y="68" width="2" height="6" fill="#1E7A00"/>

<!-- small cactus -->
<rect x="744" y="84" width="6" height="26" fill="#1E7A00"/>
<rect x="736" y="90" width="8" height="5"  fill="#1E7A00"/>
<rect x="736" y="86" width="5" height="9"  fill="#1E7A00"/>
<rect x="750" y="94" width="8" height="5"  fill="#1E7A00"/>
<rect x="753" y="88" width="5" height="11" fill="#1E7A00"/>

<!-- ── COVERED WAGON ── -->
<!-- canvas arch (cream) — stacked rects widening downward -->
<rect x="376" y="38" width="48" height="4" fill="#EDE0C4"/>
<rect x="372" y="42" width="56" height="4" fill="#EDE0C4"/>
<rect x="368" y="46" width="64" height="4" fill="#EDE0C4"/>
<rect x="364" y="50" width="72" height="4" fill="#EDE0C4"/>
<rect x="362" y="54" width="76" height="4" fill="#EDE0C4"/>
<rect x="360" y="58" width="80" height="4" fill="#EDE0C4"/>
<!-- canvas sides -->
<rect x="356" y="58" width="6"  height="20" fill="#EDE0C4"/>
<rect x="438" y="58" width="6"  height="20" fill="#EDE0C4"/>
<!-- canvas inner shadow -->
<rect x="363" y="42" width="5"  height="36" fill="#D4C09A" opacity="0.55"/>
<rect x="432" y="42" width="5"  height="36" fill="#D4C09A" opacity="0.55"/>

<!-- wagon body (wood) -->
<rect x="350" y="76" width="100" height="24" fill="#7B3A0E"/>
<rect x="350" y="80" width="100" height="2"  fill="#5C2C0A"/>
<rect x="350" y="86" width="100" height="2"  fill="#5C2C0A"/>
<rect x="350" y="92" width="100" height="2"  fill="#5C2C0A"/>
<!-- side posts -->
<rect x="350" y="76" width="6"  height="24" fill="#5C2C0A"/>
<rect x="444" y="76" width="6"  height="24" fill="#5C2C0A"/>

<!-- axle -->
<rect x="366" y="98" width="68" height="4" fill="#231200"/>

<!-- ── FRONT WHEEL (center 382,100) ── -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    from="0 382 100" to="360 382 100" dur="0.75s" repeatCount="indefinite"/>
  <circle cx="382" cy="100" r="14" fill="none" stroke="#231200" stroke-width="5"/>
  <line x1="382" y1="86"  x2="382" y2="114" stroke="#231200" stroke-width="3"/>
  <line x1="368" y1="100" x2="396" y2="100" stroke="#231200" stroke-width="3"/>
  <line x1="372" y1="90"  x2="392" y2="110" stroke="#231200" stroke-width="2"/>
  <line x1="372" y1="110" x2="392" y2="90"  stroke="#231200" stroke-width="2"/>
  <circle cx="382" cy="100" r="4" fill="#231200"/>
</g>

<!-- ── BACK WHEEL (center 418,100) ── -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    from="0 418 100" to="360 418 100" dur="0.75s" repeatCount="indefinite"/>
  <circle cx="418" cy="100" r="14" fill="none" stroke="#231200" stroke-width="5"/>
  <line x1="418" y1="86"  x2="418" y2="114" stroke="#231200" stroke-width="3"/>
  <line x1="404" y1="100" x2="432" y2="100" stroke="#231200" stroke-width="3"/>
  <line x1="408" y1="90"  x2="428" y2="110" stroke="#231200" stroke-width="2"/>
  <line x1="408" y1="110" x2="428" y2="90"  stroke="#231200" stroke-width="2"/>
  <circle cx="418" cy="100" r="4" fill="#231200"/>
</g>

<!-- ── PIXEL CODER (left side, sitting at desk) ── -->
<!-- desk surface -->
<rect x="60" y="92" width="52" height="5" fill="#5C2C0A"/>
<rect x="56" y="92" width="60" height="4" fill="#7B3A0E"/>
<!-- desk legs -->
<rect x="60" y="96" width="4" height="14" fill="#5C2C0A"/>
<rect x="108" y="96" width="4" height="14" fill="#5C2C0A"/>

<!-- monitor stand -->
<rect x="84" y="86" width="4" height="8" fill="#333"/>
<rect x="80" y="89" width="12" height="3" fill="#333"/>
<!-- monitor screen -->
<rect x="68" y="64" width="36" height="26" fill="#111"/>
<rect x="70" y="66" width="32" height="22" fill="#0a2a0a"/>
<!-- screen glow (animated) -->
<rect x="70" y="66" width="32" height="22" fill="#00ff41" opacity="0.08">
  <animate attributeName="opacity" values="0.08;0.18;0.08" dur="2s" repeatCount="indefinite"/>
</rect>
<!-- code lines on screen -->
<rect x="72" y="69" width="18" height="2" fill="#00ff41" opacity="0.9"/>
<rect x="72" y="73" width="24" height="2" fill="#00ff41" opacity="0.9"/>
<rect x="72" y="77" width="14" height="2" fill="#00ff41" opacity="0.9"/>
<rect x="72" y="81" width="20" height="2" fill="#00ff41" opacity="0.9"/>
<!-- blinking cursor -->
<rect x="92" y="81" width="2" height="2" fill="#00ff41">
  <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
</rect>

<!-- person: head -->
<rect x="83" y="52" width="12" height="12" fill="#F5C5A3"/>
<!-- hair -->
<rect x="83" y="52" width="12" height="3" fill="#2C1A0E"/>
<rect x="83" y="52" width="2"  height="7" fill="#2C1A0E"/>
<!-- eyes -->
<rect x="86" y="57" width="2" height="2" fill="#1a1a1a"/>
<rect x="91" y="57" width="2" height="2" fill="#1a1a1a"/>

<!-- person: body -->
<rect x="82" y="64" width="14" height="14" fill="#2C4A8C"/>
<!-- person: left arm (typing, animated) -->
<g>
  <rect x="74" y="69" width="8" height="4" fill="#2C4A8C"/>
  <rect x="72" y="72" width="6" height="3" fill="#F5C5A3"/>
  <animateTransform attributeName="transform" type="translate"
    values="0,0;0,-1;0,0" dur="0.3s" repeatCount="indefinite"/>
</g>
<!-- person: right arm (typing, animated, offset) -->
<g>
  <rect x="96" y="69" width="8" height="4" fill="#2C4A8C"/>
  <rect x="100" y="72" width="6" height="3" fill="#F5C5A3"/>
  <animateTransform attributeName="transform" type="translate"
    values="0,-1;0,0;0,-1" dur="0.3s" repeatCount="indefinite"/>
</g>

<!-- ── PIXEL TEXT ── -->
<text x="10" y="134" font-family="'Courier New', monospace" font-size="10"
  fill="#C4A35A" letter-spacing="2" font-weight="bold">OREGON TRAIL · 2026</text>
<text x="580" y="134" font-family="'Courier New', monospace" font-size="10"
  fill="#C4A35A" letter-spacing="1">YOU HAVE NOT DIED OF DYSENTERY</text>
</svg>
